; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3]
platform = espressif32
; The main controller is an ESP32-S3-WROOM N16R8:
; 16 MB quad flash + 8 MB octal PSRAM, with logs on the external UART bridge.
board = freenove_esp32_s3_wroom
framework = arduino
; GPIO35/36 are used by the TMC UART on this PCB and conflict with octal
; PSRAM wiring. The control firmware fits in internal RAM, so keep PSRAM off.
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_unflags = -DBOARD_HAS_PSRAM
lib_deps = 
	bogde/HX711@^0.7.5
	sstaub/Ticker@^4.4.0
	gin66/FastAccelStepper@0.33.2
	teemuatlut/TMCStepper@^0.7.3
	xreef/PCF8574 library@^2.4.0
