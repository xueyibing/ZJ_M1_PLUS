; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-n16r2]
platform = espressif32
; Project-local board manifest: boards/esp32-s3-n16r2.json
; ESP32-S3-WROOM-1-N16R2 = 16MB QD Flash + 2MB QSPI (Quad) PSRAM.
board = esp32-s3-n16r2
framework = espidf
upload_port = COM22
monitor_port = COM22
upload_speed = 460800
board_build.partitions = partitions.csv
; Workaround: xtensa-esp-elf-gcc internal compiler error (segfault in IRA pass)
; on esp_lcd_panel_rgb.c. -O1 no longer avoids it after a clean rebuild; -Os
; uses a different register-allocation path that compiles cleanly and also
; trims flash usage.
build_flags =
    -Os
    -I${PROJECT_DIR}/components
    -I${PROJECT_DIR}/components/lvgl

